<!-- 此版本仅支持IE9以上浏览器，适配手机版 -->
<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
		<meta charset="utf-8">
		<title>打灰狼</title>
		<link rel="shortcut icon" href="image/favicon.png">
		<link rel="stylesheet" type="text/css" href="css/bootstrap.min.css" />
		<link rel="stylesheet" type="text/css" href="css/style.css" />
		<script src="js/jquery-3.3.1.min.js" type="text/javascript" charset="utf-8"></script>
	</head>
	<body>
		<!-- 绘制场景盒子 -->
		<div class="GameBoxBg">
			<!-- <img class="d" id="newImg" src="" /> -->
			<!-- 绘制头部 -->
			<div class="GameHeader">
				<div>
					<!-- 分数盒子 -->
					<div class="scoreBox">
						<span class="scoreTitle"><strong>得分: </strong></span>
						<strong><span class="scoreNum"> 0</span></strong>
					</div>
					<div class="lolgBox">
						<img src="image/打灰太狼.png">
					</div>
				</div>
				<div class="listBOx">
					<!-- 分数盒子 -->
					<div class="timeBox">
						<strong><span class="timeNum">60</span> 秒</strong>
					</div>
				</div>
			</div>
			<div class="startBox">
				<div class="difficulty-selector">
					<button class="difficulty-btn" data-level="1">简单</button>
					<button class="difficulty-btn active" data-level="2">中等</button>
					<button class="difficulty-btn" data-level="3">困难</button>
				</div>
				<button class="start">开始游戏</button>
				<button type="button" class="btn_experiment_info" data-toggle="modal" data-target="#exampleModalScrollable">
					实验说明
				</button>
			</div>

			<div class="gameOverBox">
				<h1 class="over">GAME OVER</h1>
				<div class="settlementBox">
					<p class="settlementTitle">您的得分：<span id="settlementNum">

						</span></p>
				</div>
				<button class="restart">重新开始</button>
			</div>

			<!-- 实验数据标识 - 用于脑电波同步 -->
			<div id="eeg_trial_id" style="display:none;" data-trial="0"></div>

		</div>

		<!-- 规则弹窗体 -->
		<!-- Modal -->
		<div class="modal fade gameRules" id="exampleModalScrollable" tabindex="-1" role="dialog" aria-labelledby="exampleModalScrollableTitle"
		 aria-hidden="true">
			<div class="modal-dialog modal-dialog-scrollable modal-dialog-centered" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h5>实验说明</h5>
						<button type="button" class="close" data-dismiss="modal" aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
					</div>
					<div class="modal-body">
						<p>实验说明内容将由主试人员口头宣读。</p>
					</div>

				</div>
			</div>
		</div>

		<script src="js/bootstrap.min.js" type="text/javascript" charset="utf-8"></script>
		<script src="js/mian.js" type="text/javascript" charset="utf-8"></script>
	<!-- 移动端错误提示 -->
	<div id="mobile-error-display" style="display:none; position:fixed; top:0; left:0; width:100%; background:red; color:white; padding:10px; z-index:99999; font-size:12px; word-break:break-all;"></div>

	</body>
</html>
